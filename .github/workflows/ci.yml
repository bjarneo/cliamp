name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libflac-dev libvorbis-dev libogg-dev libmpg123-dev shellcheck
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: make fmt-check vet staticcheck security
      - run: go test -count=1 -race ./...
      - run: make coverage
      - run: shellcheck install.sh
      - run: git diff --exit-code

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
          - os: windows-2025
            goos: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install codec libs (macOS)
        if: matrix.goos == 'darwin'
        run: brew install flac libvorbis libogg mpg123 pkg-config
      - name: Set up MinGW toolchain (Windows)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-mpg123
      - name: Test and build (Windows)
        if: matrix.goos == 'windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          # Some MSYS2 libogg builds ship a libogg-0.dll whose export table is
          # missing ogg_stream_iovecin, even though it's present in the static
          # libogg.a. Force just that library to link statically.
          CGO_LDFLAGS: "-Wl,-Bstatic -logg -Wl,-Bdynamic"
        run: |
          go test -count=1 ./...
          go build -trimpath ./...
      - name: Test and build (non-Windows)
        if: matrix.goos != 'windows'
        run: |
          go test -count=1 ./...
          go build -trimpath ./...
